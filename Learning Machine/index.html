<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess the Animal Sound</title>
<style>
  :root { --bg:#14213d; --card:#1d2f57; --accent:#fca311; --text:#f5f5f5; --muted:#a9b4cc; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); padding:24px 16px; }
  h1 { margin:0 0 6px; font-size:clamp(1.6rem,5vw,2.4rem); text-align:center; }
  p.sub { margin:0 0 24px; color:var(--muted); text-align:center; }
  #stage { width:min(420px,100%); aspect-ratio:1; background:var(--card); border-radius:24px;
           display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
           box-shadow:0 10px 30px rgba(0,0,0,.35); overflow:hidden; text-align:center; padding:16px; }
  #stage img { max-width:100%; max-height:80%; object-fit:contain; border-radius:16px; animation:pop .35s ease; }
  #emoji { font-size:min(40vw,180px); line-height:1; animation:pop .35s ease; }
  #label { font-size:1.6rem; font-weight:700; text-transform:capitalize; }
  #hint { color:var(--muted); font-size:1.1rem; }
  @keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  button { margin-top:22px; padding:14px 32px; font-size:1.1rem; font-weight:700; border:0; border-radius:999px;
           background:var(--accent); color:#14213d; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #status { margin-top:10px; color:var(--muted); min-height:1.4em; text-align:center; }
  #bars { width:min(420px,100%); margin-top:18px; display:grid; gap:8px; }
  .row { display:grid; grid-template-columns:110px 1fr 44px; align-items:center; gap:8px; font-size:.9rem; }
  .track { background:var(--card); border-radius:99px; height:10px; overflow:hidden; }
  .fill { height:100%; width:0; background:var(--accent); transition:width .12s; }
</style>
</head>
<body>
  <h1>🎧 Guess the Animal Sound</h1>
  <p class="sub">Make an animal sound near your microphone and the matching animal will appear.</p>

  <div id="stage">
    <div id="hint">Press Start, then make a sound…</div>
  </div>

  <button id="startBtn">🎤 Start listening</button>
  <div id="status"></div>
  <div id="bars"></div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
  <script>
  /* ============ EDIT THIS SECTION ============ */

  // 1) Paste your exported Teachable Machine audio model URL (must end with a slash).
  //    In Teachable Machine: Export Model > Audio > Upload my model > copy the link.
  const MODEL_URL = "https://teachablemachine.withgoogle.com/models/x6Or6Gy40/";

  // 2) Map each class name (exactly as named in Teachable Machine, any case) to an image.
  //    Download your animal pictures from the Drive folder into an "images" folder next to this file.
  //    If an image is missing, the emoji is shown instead.
  const ANIMALS = {
    "cat":  { image: "images/cat.jpg",  emoji: "🐱" },
    "cow":  { image: "images/cow.jpg",  emoji: "🐮" },
    "dog":  { image: "images/dog.jpg",  emoji: "🐶" },
    "duck": { image: "images/duck.jpg", emoji: "🦆" },
    "goat": { image: "images/goat.jpg", emoji: "🐐" },
    "owl":  { image: "images/owl.jpg",  emoji: "🦉" },
    "pig":  { image: "images/pig.jpg",  emoji: "🐷" },
    "tuko": { image: "images/tuko.jpg", emoji: "🦎" }
  };

  const THRESHOLD = 0.5;           // how confident the model must be (0 to 1)
  const HOLD_MS   = 3000;          // how long the animal stays on screen
  const IGNORE    = ["background noise", "_background_noise_"];

  /* ============================================ */

  const stage = document.getElementById("stage");
  const statusEl = document.getElementById("status");
  const bars = document.getElementById("bars");
  const btn = document.getElementById("startBtn");
  let recognizer, labels = [], hideTimer, current = null;

  function showHint(text) { stage.innerHTML = `<div id="hint">${text}</div>`; current = null; }

  function showAnimal(name) {
    if (current === name) { resetTimer(); return; }
    current = name;
    const info = ANIMALS[name.toLowerCase()] || {};
    const emoji = info.emoji || "🐾";
    stage.innerHTML = "";
    if (info.image) {
      const img = new Image();
      img.alt = name;
      img.onload = () => { stage.innerHTML = ""; stage.append(img, labelEl(name)); };
      img.onerror = () => { stage.innerHTML = `<div id="emoji">${emoji}</div>`; stage.append(labelEl(name)); };
      img.src = info.image;
    } else {
      stage.innerHTML = `<div id="emoji">${emoji}</div>`;
      stage.append(labelEl(name));
    }
    resetTimer();
  }
  function labelEl(name) { const d = document.createElement("div"); d.id = "label"; d.textContent = name; return d; }
  function resetTimer() { clearTimeout(hideTimer); hideTimer = setTimeout(() => showHint("Listening… make a sound!"), HOLD_MS); }

  function buildBars() {
    bars.innerHTML = labels.map((l, i) =>
      `<div class="row"><span>${l}</span><div class="track"><div class="fill" id="f${i}"></div></div><span id="p${i}">0%</span></div>`
    ).join("");
  }

  async function start() {
    btn.disabled = true;
    statusEl.textContent = "Loading model…";
    try {
      recognizer = speechCommands.create(
        "BROWSER_FFT", undefined,
        MODEL_URL + "model.json",
        MODEL_URL + "metadata.json"
      );
      await recognizer.ensureModelLoaded();
      labels = recognizer.wordLabels();
      buildBars();
      statusEl.textContent = "Listening… allow microphone access if asked.";
      showHint("Listening… make a sound!");

      await recognizer.listen(result => {
        const scores = result.scores;
        let best = 0;
        scores.forEach((s, i) => {
          document.getElementById("f" + i).style.width = (s * 100).toFixed(0) + "%";
          document.getElementById("p" + i).textContent = (s * 100).toFixed(0) + "%";
          if (s > scores[best]) best = i;
        });
        const name = labels[best];
        if (scores[best] >= THRESHOLD && !IGNORE.includes(name.toLowerCase())) showAnimal(name);
      }, {
        includeSpectrogram: false,
        probabilityThreshold: 0.5,
        invokeCallbackOnNoiseAndUnknown: true,
        overlapFactor: 0.5
      });
      btn.textContent = "⏹ Stop";
      btn.disabled = false;
      btn.onclick = stop;
    } catch (e) {
      console.error(e);
      statusEl.textContent = "Couldn't start: " + e.message + " (check MODEL_URL and microphone permission)";
      btn.disabled = false;
    }
  }

  function stop() {
    recognizer.stopListening();
    statusEl.textContent = "Stopped.";
    showHint("Press Start, then make a sound…");
    btn.textContent = "🎤 Start listening";
    btn.onclick = start;
  }

  btn.onclick = start;
  </script>
</body>
</html>
